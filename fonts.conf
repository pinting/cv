<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <description>Project-specific font configuration for deterministic CV PDF rendering</description>

  <!-- Include host system font configuration -->
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>

  <!-- Standard font directories across distributions -->
  <dir>/usr/share/fonts</dir>
  <dir>/usr/local/share/fonts</dir>
  <dir prefix="xdg">fonts</dir>
  <dir>~/.local/share/fonts</dir>
  <dir>~/.fonts</dir>
  <dir>/Library/Fonts</dir>
  <dir>~/Library/Fonts</dir>

  <!-- Map sans-serif and body fonts to FreeSans -->
  <match target="pattern">
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="assign" binding="strong"><string>FreeSans</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Verdana</string></test>
    <edit name="family" mode="assign" binding="strong"><string>FreeSans</string></edit>
  </match>

  <!-- Map monospace and code fonts to FreeMono -->
  <match target="pattern">
    <test qual="any" name="family"><string>monospace</string></test>
    <edit name="family" mode="assign" binding="strong"><string>FreeMono</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Menlo</string></test>
    <edit name="family" mode="assign" binding="strong"><string>FreeMono</string></edit>
  </match>

  <!-- Map heading monospace fonts to Liberation Mono -->
  <match target="pattern">
    <test qual="any" name="family"><string>Cousine</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Liberation Mono</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Consolas</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Liberation Mono</string></edit>
  </match>

  <!-- Generic fallbacks -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>FreeSans</family>
    </prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>FreeMono</family>
    </prefer>
  </alias>

  <!-- User cache location -->
  <cachedir prefix="xdg">fontconfig</cachedir>
  <cachedir>~/.fontconfig</cachedir>
</fontconfig>
